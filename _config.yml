title: "BusinessCrowd"
description: "Get your business in front of the crowd"
url: "https://businesscrowd.co.uk"
baseurl: ""

author:
  name: "BusinessCrowd"
  email: "hello@businesscrowd.co.uk"

# Build
timezone: Europe/London
encoding: utf-8
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false

# Collections
collections:
  pages:
    output: true
    permalink: /:path/
  lessons:
    output: true
    permalink: /lti-content/lessons/:slug/
  courses:
    output: true
    permalink: /lti-content/courses/:slug/
  events:
    output: true
    permalink: /lti-content/events/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "lessons"
    values:
      layout: "lesson"
  - scope:
      path: ""
      type: "courses"
    values:
      layout: "course"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"

# Permalinks
permalink: /blog/:year/:month/:day/:slug/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.sh"
  - migrate-to-r2.js
  - migrate-sftp-to-r2.js
  - migrate-errors.json
  - package.json
  - package-lock.json
  - .env
  - .env.example
  - import-wordpress.js
  - functions
  - db
  - wrangler.toml
  - migrate-errors.json
  - migrate-sftp-errors.json
